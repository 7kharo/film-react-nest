services:
  database:
    image: postgres:16.4
    container_name: film_database
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/sql/prac.init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backend/sql/prac.films.sql:/docker-entrypoint-initdb.d/02-films.sql:ro
      - ./backend/sql/prac.schedules.sql:/docker-entrypoint-initdb.d/03-schedules.sql:ro
    ports:
      - '5432:5432'
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: 'ghcr.io/${OWNER}/sp16_backend:latest'
    container_name: film_backend
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV}
      LOG_FORMAT: ${LOG_FORMAT}
      DATABASE_DRIVER: ${DATABASE_DRIVER}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_USERNAME: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      DATABASE_NAME: ${DB_NAME}
    ports:
      - '3000:3000'
    networks:
      - internal
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: 'ghcr.io/${OWNER}/sp16_frontend:latest'
    container_name: film_frontend_builder
    restart: always
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_CDN_URL: ${VITE_CDN_URL}
    volumes:
      - frontend_build:/dist
    networks:
      - internal

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    restart: always
    ports:
      - '8080:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - internal
    depends_on:
      - database

  server:
    image: 'ghcr.io/${OWNER}/sp16_server:latest'
    container_name: film_nginx
    restart: always
    ports:
      - '80:80'
    volumes:
      - frontend_build:/var/www
    depends_on:
      - frontend
      - backend
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  db_data:
    name: film_db_data
  pgadmin-data:
    name: film_pgadmin_data
  frontend_build:
    name: film_frontend_build